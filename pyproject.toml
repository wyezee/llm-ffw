[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ffw"
version = "0.17.1"
description = "High-speed deterministic scanning for LLM inputs and outputs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14.7,<3.15"
# CI requires removing the Dependabot pyproject exclusion before this is nonempty.
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]

[tool.setuptools.packages.find]
include = ["llm_ffw*"]

[tool.setuptools.package-data]
llm_ffw = ["py.typed"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Begin with correctness-focused checks. Broader style rules should only be
# enabled after their existing findings have been reviewed deliberately.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["llm_ffw", "typing_tests"]
show_error_codes = true
warn_unused_configs = true
