name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.14.7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Install mypy
        run: python -m pip install --disable-pip-version-check mypy==2.3.0

      - name: Type-check source and public API examples
        run: python -m mypy

      - name: Build and install the distribution
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m pip install --force-reinstall "$RUNNER_TEMP"/wheels/*.whl

      - name: Type-check against the installed distribution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/typecheck"
          cp typing_tests/public_api.py "$RUNNER_TEMP/typecheck/public_api.py"
          cd "$RUNNER_TEMP/typecheck"
          python -m mypy --strict --python-version 3.14 public_api.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.14.7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.3

      - name: Lint source, tests, benchmarks, and tools
        run: python -m ruff check --output-format=github llm_ffw tests benchmarks tools typing_tests

  test-and-package:
    name: Python 3.14.7 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.14.7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Verify interpreter
        run: python -c "import sys; assert sys.version_info[:3] == (3, 14, 7), sys.version"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Enforce deterministic PII accuracy gate
        run: python tools/pii_accuracy_gate.py

      - name: Compile source and test modules
        run: python -m compileall -q llm_ffw tests benchmarks tools typing_tests

      - name: Verify standard-library-only runtime imports
        run: python tools/check_runtime_imports.py

      - name: Build and smoke-test isolated wheel
        run: python tools/release_smoke.py
