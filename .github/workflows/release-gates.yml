name: Release gates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-envelope:
    name: 8 MB envelope / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.14.7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Run isolated wheel gate
        run: python tools/release_smoke.py

      - name: Run balanced-policy performance gate
        run: python benchmarks/bench_policy.py --size 8000000 --rounds 3 --min-throughput-mib-s 5

      - name: Run invisible-character clean and canonicalization gates
        run: >-
          python benchmarks/bench_invisible_characters.py
          --size 8000000
          --rounds 3
          --workers 2
          --concurrency 4
          --process-requests 8
          --max-clean-overhead-percent 10
          --min-dirty-throughput-mib-s 4
          --max-dirty-peak-mib 128
          --min-process-requests-per-second 0.8

      - name: Run banned-substring production envelope
        run: >-
          python benchmarks/bench_banned_substrings.py
          --size 8000000
          --rounds 3
          --workers 2
          --concurrency 4
          --process-requests 8
          --min-throughput-mib-s 3
          --max-peak-mib 128
          --min-process-requests-per-second 0.5

      - name: Run Unicode-tag production envelope
        run: >-
          python benchmarks/bench_unicode_tag_smuggling.py
          --size 8000000
          --rounds 3
          --workers 2
          --concurrency 4
          --process-requests 8
          --min-clean-throughput-mib-s 5
          --min-rgi-throughput-mib-s 5
          --min-dirty-throughput-mib-s 3.5
          --max-peak-mib 128
          --min-process-requests-per-second 0.7

      - name: Run JSON-output production envelope
        run: >-
          python benchmarks/bench_json_output.py
          --size 8000000
          --rounds 3
          --workers 2
          --concurrency 4
          --process-requests 8
          --min-throughput-mib-s 3
          --min-redacted-throughput-mib-s 2.5
          --max-peak-mib 128
          --min-process-requests-per-second 0.5

      - name: Run unsafe-URL production envelope
        run: >-
          python benchmarks/bench_unsafe_urls.py
          --size 8000000
          --rounds 3
          --workers 2
          --concurrency 4
          --process-requests 8
          --min-throughput-mib-s 3
          --min-unsafe-throughput-mib-s 2.5
          --max-peak-mib 128
          --min-process-requests-per-second 0.5

      - name: Run payment-card production envelope
        run: >-
          python benchmarks/bench_payment_cards.py
          --size 8000000
          --rounds 3
          --workers 2
          --concurrency 4
          --process-requests 8
          --min-throughput-mib-s 3
          --min-card-throughput-mib-s 2.5
          --max-peak-mib 128
          --min-process-requests-per-second 0.5

      - name: Run process soak and recycling gate
        run: python benchmarks/bench_soak.py --size 8000000 --workers 4 --concurrency 8 --requests 32 --max-tasks-per-child 4 --min-requests-per-second 1

      - name: Run peak-memory gate
        run: python benchmarks/bench_memory.py --size 8000000 --max-peak-rss-mib 512

      - name: Run atomic-reload lifecycle gate
        run: >-
          python benchmarks/bench_manager_reload.py
          --size 8000000
          --workers 2
          --concurrency 4
          --reloads 4
          --min-requests 16
          --max-tasks-per-child 8
          --timeout 180
          --memory-sample-ms 10
          --max-peak-tree-rss-mib 768
          --max-reload-seconds 30
          --min-requests-per-second 0.5
